server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mindq-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mindq_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      leak-detection-threshold: ${HIKARI_LEAK_THRESHOLD:60000}
      pool-name: MindQPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}
        use_sql_comments: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    free-limit-bytes: ${STORAGE_FREE_LIMIT_BYTES:524288000}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}
  jwt:
    # HS256 signing key - MUST be at least 32 characters. Override via JWT_SECRET in .env.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    password-reset-expiration-minutes: ${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:30}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH:5}
    ai-per-minute: ${RATE_LIMIT_AI:10}
    upload-per-minute: ${RATE_LIMIT_UPLOAD:10}
    general-per-minute: ${RATE_LIMIT_GENERAL:60}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      default-model: ${GROQ_DEFAULT_MODEL:openai/gpt-oss-20b}
      max-tokens: ${GROQ_MAX_TOKENS:4096}
      temperature: ${GROQ_TEMPERATURE:0.7}
      max-material-chars: 80000
  elastic-email:
    api-key: ${ELASTIC_EMAIL_API_KEY:}
    sender: ${ELASTIC_EMAIL_SENDER:}
    sender-name: ${ELASTIC_EMAIL_SENDER_NAME:MindQ}
  otp:
    enabled: ${OTP_ENABLED:false}
  payment:
    razorpay:
      key: ${RAZORPAY_KEY:rzp_test_placeholder}
      secret: ${RAZORPAY_SECRET:placeholder_secret}
      enabled: ${RAZORPAY_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
