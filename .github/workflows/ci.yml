name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Backend tests and build
  backend:
    name: Backend
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mindq_test
          MYSQL_USER: mindq_test
          MYSQL_PASSWORD: mindq_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run tests
        run: mvn test --no-transfer-progress
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: mindq_test
          DB_USERNAME: mindq_test
          DB_PASSWORD: mindq_test
          JWT_SECRET: test-secret-key-for-ci-pipeline-min-32-chars
          SHOW_SQL: 'false'
      
      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress
        working-directory: backend
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # Frontend tests and build
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Run tests
        run: npx vitest run
        working-directory: frontend
      
      - name: Build
        run: npm run build
        working-directory: frontend
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Docker build (only on push to main/master)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        run: docker build -t mindq-backend:${{ github.sha }} ./backend
      
      - name: Build frontend image
        run: docker build -t mindq-frontend:${{ github.sha }} ./frontend
      
      - name: Test docker-compose up
        run: |
          docker compose up -d

          # Wait for all services to become healthy (max 120s)
          TIMEOUT=120
          ELAPSED=0
          echo "Waiting for services to become healthy (timeout: ${TIMEOUT}s)..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEALTHY_COUNT=$(docker compose ps --format "{{.Health}}" 2>/dev/null | grep -c "healthy" || true)
            TOTAL=$(docker compose ps --format "{{.Health}}" 2>/dev/null | grep -c "" || true)
            UNHEALTHY=$(docker compose ps --format "{{.Health}}" 2>/dev/null | grep -c "unhealthy" || true)

            if [ "$UNHEALTHY" -gt 0 ]; then
              echo "ERROR: A service is unhealthy after ${ELAPSED}s"
              docker compose ps
              docker compose logs backend
              docker compose logs mysql
              docker compose down
              exit 1
            fi

            if [ "$HEALTHY_COUNT" -ge 3 ] && [ "$TOTAL" -ge 3 ]; then
              echo "All 3 services healthy after ${ELAPSED}s"
              break
            fi

            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "  [${ELAPSED}s] ${HEALTHY_COUNT}/${TOTAL} services healthy..."
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "ERROR: Timed out after ${TIMEOUT}s waiting for services"
            docker compose ps
            docker compose logs backend
            docker compose logs mysql
            docker compose down
            exit 1
          fi

          # Verify endpoints respond
          curl -f http://localhost:8080/api/v1/health || exit 1
          curl -f http://localhost:80 || exit 1

          docker compose down
