<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindQ — AI-Powered Learning Platform</title>
    <meta name="description" content="AI-Powered Learning Platform built with Spring Boot, React, and Groq AI." />
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent theme flash: apply dark class before React mounts -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mindq_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = saved === 'dark' || (saved !== 'light' && prefersDark);
          if (useDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Loading splash screen styles -->
    <style>
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #splash-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pulse 2s ease-in-out infinite;
        box-shadow: 0 0 40px rgba(37, 99, 235, 0.3);
      }
      .splash-logo::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 24px;
        border: 2px solid rgba(37, 99, 235, 0.2);
        animation: splash-ring 2s ease-in-out infinite;
      }
      .splash-logo span {
        font-size: 36px;
        font-weight: 800;
        color: white;
        letter-spacing: -1px;
      }
      .splash-text {
        margin-top: 24px;
        font-family: 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: -0.5px;
      }
      .splash-tagline {
        margin-top: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: #64748b;
      }
      .splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 32px;
      }
      .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2563eb;
        animation: splash-dot 1.4s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-ring {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body class="antialiased font-['Inter',sans-serif]">
    <div id="root">
      <!-- Splash screen: visible until React mounts -->
      <div id="splash-loader">
        <div class="splash-logo">
          <span>Q</span>
        </div>
        <div class="splash-text">MindQ</div>
        <div class="splash-tagline">AI-Powered Learning Platform</div>
        <div class="splash-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
